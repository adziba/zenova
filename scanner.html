<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZENOVA QR Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}body{margin:0;background:#070b19;color:#f8fafc;padding:16px;min-height:100vh;display:flex;align-items:center;justify-content:center}.wrap{width:100%;max-width:760px;margin:0 auto}.panel{background:#162038;border:2px solid #a9852d;border-radius:22px;padding:30px;text-align:center;box-shadow:0 16px 40px #0007}.logo-wrap{margin:0 auto 12px;display:flex;justify-content:center}.logo-img{max-height:85px;width:auto;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,0.4);background:#fff;padding:4px}.brand{color:#fbbf24;font-weight:800;font-size:24px;margin:4px 0}.sub{color:#aab6cc;font-size:13px;letter-spacing:1px;margin:5px 0 20px}.msg{color:#34d399;font-size:14px;font-weight:700;margin:15px 0;background:#05966922;padding:10px;border-radius:10px;border:1px solid #059669}.result{border:2px solid #475569;background:#0b1329;border-radius:14px;padding:24px;margin-top:20px;transition:all 0.15s ease}.result.ok{border-color:#34d399}.result.bad{border-color:#f87171}.student{font-size:28px;font-weight:800;margin:12px 0;color:#fff}.muted{color:#aab6cc;font-size:14px}
</style>
</head>
<body>
<main class="wrap">
  <section class="panel">
    <!-- Logo Asli ZENOVA dari Google Drive -->
    <div class="logo-wrap">
      <img class="logo-img" src="https://drive.google.com/thumbnail?id=1DCds-GNg3riK92o9l2JxYpMv7UOEqMZv&sz=w400" alt="Logo ZENOVA">
    </div>
    <div class="brand">ZENOVA ATTENDANCE</div>
    <div class="sub">MTs MUHAMMADIYAH BATANG · INSTANT SCANNER</div>
    
    <input type="text" id="scanInput" autocomplete="off" style="position:absolute; opacity:0; pointer-events:none;">
    
    <div id="camMsg" class="msg">⚡ SIAP! SILAKAN SCAN KARTU SISWA</div>
    
    <div class="result" id="result">
      <div class="muted" id="state">MENUNGGU SCAN</div>
      <div class="student" id="student">Arahkan alat scanner ke kartu</div>
      <div id="info" class="muted">Nama dan kelas akan muncul seketika di sini</div>
    </div>
  </section>
</main>

<script>
// --- PASTIKAN URL INI ADALAH URL /EXEC TERBARU ANDA ---
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbyxJmG1G_j3Hc_TTVr1sGr3F7_BK2SDpeUxuI92kg2s5b9FyjMhFxNuakOzcVfPfDM6/exec';

let localDB = JSON.parse(localStorage.getItem('zenova_db_cache') || '{}');
let scannedToday = JSON.parse(localStorage.getItem('zenova_today_' + new Date().toISOString().slice(0,10)) || '{}');
let lastValue='', lastAt=0;
const $=id=>document.getElementById(id);

// Sinkronisasi database diam-diam di latar belakang (tidak menghambat layar)
function syncDatabase() {
  let cb = 'zenovaSync_' + Date.now();
  let script = document.createElement('script');
  window[cb] = function(res) {
    delete window[cb];
    script.remove();
    if (res && res.success && res.db) {
      localDB = res.db;
      localStorage.setItem('zenova_db_cache', JSON.stringify(localDB));
      $('camMsg').textContent = '⚡ SIAP! DATABASE TERSINKRON (' + Object.keys(localDB).length + ' SISWA)';
    }
  };
  script.src = DEFAULT_GAS_URL + '?api=list&callback=' + cb + '&_=' + Date.now();
  document.body.appendChild(script);
}

window.addEventListener('load', () => { 
  $('scanInput').focus(); 
  syncDatabase();
});
window.addEventListener('click', () => { $('scanInput').focus(); });
setInterval(() => { if(document.activeElement !== $('scanInput')) { $('scanInput').focus(); } }, 400);

document.addEventListener('keydown', function(e) {
  let target = $('scanInput');
  if (e.key === 'Enter') {
    let val = target.value.trim();
    target.value = '';
    if (val) processInstantScan(val);
  } else if (e.key.length === 1) {
    if(document.activeElement !== target) target.value += e.key;
  }
});

function processInstantScan(rawId) {
  let id = String(rawId || '').trim().toUpperCase();
  if (id.endsWith('.0')) id = id.slice(0, -2);
  if (!id) return;
  
  let now = Date.now();
  if (id === lastValue && now - lastAt < 1800) return;
  lastValue = id;
  lastAt = now;

  // 1. TAMPILKAN HASIL INSTAN (< 0.05 DETIK) JIKA DATA ADA DI CACHE LOKAL
  let siswa = localDB[id];
  if (siswa) {
    let todayKey = 'zenova_today_' + new Date().toISOString().slice(0,10);
    let d = new Date();
    let isLate = (d.getHours() > 6 || (d.getHours() === 6 && d.getMinutes() > 40));
    let statusText = scannedToday[id] ? 'SUDAH ABSEN' : (isLate ? 'TELAT' : 'HADIR');
    
    showResult({
      success: true,
      status: statusText,
      nama: siswa.n,
      kelas: scannedToday[id] ? siswa.k + ' (Sudah absen hari ini)' : siswa.k
    });
    
    scannedToday[id] = true;
    localStorage.setItem(todayKey, JSON.stringify(scannedToday));
  } else {
    $('result').className = 'result';
    $('state').textContent = 'MEMPROSES…';
    $('student').textContent = 'ID: ' + id;
    $('info').textContent = 'Mencari di server ZENOVA…';
  }

  // 2. KIRIM & SIMPAN KE GOOGLE SHEETS DI BALIK LAYAR
  let cb = 'zenovaCallback_' + Date.now() + '_' + Math.floor(Math.random()*100000);
  let script = document.createElement('script');
  window[cb] = function(data) {
    delete window[cb];
    script.remove();
    // Jika sebelumnya belum ada di cache lokal, tampilkan hasil dari server sekarang
    if (!siswa) {
      showResult(data);
      if (data && data.success) syncDatabase();
    }
  };
  script.onerror = function() {
    delete window[cb];
    script.remove();
    if (!siswa) showResult({success:false, message:'Gagal terhubung ke server.'});
  };
  script.src = DEFAULT_GAS_URL + '?api=scan&id=' + encodeURIComponent(id) + '&callback=' + cb + '&_=' + Date.now();
  document.body.appendChild(script);
}

function showResult(r) {
  $('result').className = 'result ' + (r && r.success ? 'ok' : 'bad');
  $('state').textContent = r && r.success ? '✓ ' + String(r.status || 'BERHASIL').toUpperCase() : '✕ ABSENSI GAGAL';
  $('student').textContent = r && r.success ? r.nama : (r?.message || 'ID Tidak Ditemukan');
  $('info').textContent = r && r.success ? 'Kelas: ' + r.kelas : 'Periksa kembali ID pada kartu siswa';
  if (r && r.success) speak((r.nama || 'Siswa') + ', ' + (r.status || 'Hadir'));
  $('scanInput').focus();
}

function speak(t) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    let u = new SpeechSynthesisUtterance(t);
    u.lang = 'id-ID';
    u.rate = 1.15;
    speechSynthesis.speak(u);
  }
}
</script>
</body>
</html>
