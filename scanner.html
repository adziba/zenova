<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZENOVA QR Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}body{margin:0;background:#070b19;color:#f8fafc;padding:16px;min-height:100vh}.wrap{max-width:760px;margin:0 auto}.panel{background:#162038;border:2px solid #a9852d;border-radius:22px;padding:24px;margin:12px 0;text-align:center;box-shadow:0 16px 40px #0007}.brand{color:#fbbf24;font-weight:800;font-size:22px;margin:4px 0}.sub{color:#aab6cc;font-size:12px;letter-spacing:1px;margin:5px 0 20px}.msg{color:#34d399;font-size:15px;font-weight:700;margin:15px 0}.result{border:2px solid #475569;background:#0b1329;border-radius:14px;padding:20px;margin-top:20px}.result.ok{border-color:#34d399}.result.bad{border-color:#f87171}.student{font-size:24px;font-weight:800;margin:10px 0}.muted{color:#aab6cc;font-size:13px}.hidden{display:none!important}
</style>
</head>
<body onclick="document.getElementById('scannerInput').focus()">
<main class="wrap">
  <section class="panel">
    <div class="brand">ZENOVA ATTENDANCE</div>
    <div class="sub">MTs MUHAMMADIYAH BATANG · HARDWARE SCANNER</div>
    
    <!-- Kotak tersembunyi untuk menangkap tembakan dari alat scanner fisik -->
    <input type="text" id="scannerInput" autofocus style="opacity:0; position:absolute; left:-9999px;" onkeypress="handleScanInput(event)">
    
    <div id="camMsg" class="msg">⚡ SIAP MENERIMA SCANNER</div>
    
    <div class="result" id="result">
      <div class="muted" id="state">MENUNGGU SCAN</div>
      <div class="student" id="student">Arahkan alat scanner ke kartu siswa</div>
      <div id="info" class="muted">Hasil absensi akan tampil di sini</div>
    </div>
  </section>
</main>

<script>
// --- PASTI KAN URL DI BAWAH INI ADALAH URL /EXEC TERBARU ANDA ---
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbyxJmG1G_j3Hc_TTVr1sGr3F7_BK2SDpeUxuI92kg2s5b9FyjMhFxNuakOzcVfPfDM6/exec';

let lastValue='', lastAt=0, busy=false;
const $=id=>document.getElementById(id);

// Menjaga fokus selalu di input tersembunyi agar langsung siap nerima scan kapan saja
window.addEventListener('focus', () => { $('scannerInput').focus(); });
setInterval(() => { if(document.activeElement !== $('scannerInput')) { $('scannerInput').focus(); } }, 1000);

function handleScanInput(e) {
  if (e.key === 'Enter') {
    let inputEl = $('scannerInput');
    let val = inputEl.value.trim();
    inputEl.value = ''; // Bersihkan untuk scan berikutnya
    if (val) {
      sendScan(val);
    }
  }
}

function sendScan(id){
  id=String(id||'').trim();
  if(!id||busy)return;
  let now=Date.now();
  if(id===lastValue&&now-lastAt<2200)return;
  lastValue=id;
  lastAt=now;
  busy=true;
  
  $('result').className='result';
  $('state').textContent='MEMPROSES…';
  $('student').textContent='ID: '+id;
  $('info').textContent='Menghubungi database ZENOVA…';
  
  let base=DEFAULT_GAS_URL;
  let cb='zenovaCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  let script=document.createElement('script');
  let finished=false;
  
  let timeout=setTimeout(()=>{
    if(finished)return;
    finished=true;
    delete window[cb];
    script.remove();
    showResult({success:false,message:'Server tidak merespons.'});
  },20000);
  
  window[cb]=function(data){
    if(finished)return;
    finished=true;
    clearTimeout(timeout);
    delete window[cb];
    script.remove();
    showResult(data);
  };
  
  script.onerror=function(){
    if(finished)return;
    finished=true;
    clearTimeout(timeout);
    delete window[cb];
    script.remove();
    showResult({success:false,message:'Gagal terhubung ke Web App.'});
  };
  
  script.src=base+(base.includes('?')?'&':'?')+'api=scan&id='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
  document.body.appendChild(script);
}

function showResult(r){
  $('result').className='result '+(r&&r.success?'ok':'bad');
  $('state').textContent=r&&r.success?'✓ '+String(r.status||'BERHASIL').toUpperCase():'✕ ABSENSI GAGAL';
  $('student').textContent=r&&r.success?r.nama:(r?.message||'Tidak ditemukan');
  $('info').textContent=r&&r.success?'Kelas: '+r.kelas:'Periksa ID atau database';
  if(r&&r.success) speak((r.nama||'Siswa')+', '+(r.status||'Hadir'));
  busy=false;
}

function speak(t){
  if('speechSynthesis'in window){
    speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance(t);
    u.lang='id-ID';
    u.rate=1.1;
    speechSynthesis.speak(u);
  }
}
</script>
</body>
</html>
